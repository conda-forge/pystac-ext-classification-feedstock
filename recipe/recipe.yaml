schema_version: 1

context:
  version: "2.0.2"

package:
  name: pystac-ext-classification
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pystac-ext-classification/pystac_ext_classification-${{ version }}.tar.gz
  sha256: d4e7bc4e6ea85a838e7b41d647dda6155bb2d8f2dfb6de7cd511fe882330d4f3

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - pystac-core
    # imported but not declared as a dependency
    - pystac-ext-raster

tests:
  - python:
      imports:
        - pystac.extensions.classification
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Classification extension for PySTAC
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://pypi.org/project/pystac-ext-classification/
  documentation: https://pystac.readthedocs.io

extra:
  recipe-maintainers:
    - ocefpaf
